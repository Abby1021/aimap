    ];

    // 初始化地圖 (中心預設為台北市中心)
    const map = L.map('map').setView([25.0478, 121.5318], 12);

    // 載入 OpenStreetMap 圖層
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 建立 MarkerCluster 圖層
    const markersGroup = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 50
    });

    const markerMap = {};

    // 渲染站點標記與圖層
    function initMarkers() {
      markersGroup.clearLayers();

      stationsData.forEach(station => {
        if (!station.lat || !station.lng) return;

        // 計算無障礙出口數量
        const accExits = station.exits.filter(e => e.acc === '是').length;

        // 建立 Popup 內容
        let exitsHtml = station.exits.map(e => `
          <span class="exit-tag ${e.acc === '是' ? 'accessible' : ''}">
            ${e.name} ${e.acc === 's' || e.acc === '是' ? '♿' : ''}
          </span>
        `).join('');

        const popupContent = `
          <div class="popup-title">${station.name}</div>
          <div class="popup-loc">📍 ${station.loc}</div>
          <div style="font-size:12px; color:#6b7280;">FID CODE: ${station.code}</div>
          <div class="popup-exits-title">出入口資訊 (${station.exits.length} 個):</div>
          <div>${exitsHtml || '<span style="font-size:11px;color:#9ca3af;">尚無細部出口資料</span>'}</div>
        `;

        const marker = L.marker([station.lat, station.lng])
          .bindPopup(popupContent);

        markersGroup.addLayer(marker);
        markerMap[station.code] = marker;
      });

      map.addLayer(markersGroup);
    }

    // 渲染側邊欄清單
    function renderSidebar(stations) {
      const listEl = document.getElementById('station-list');
      listEl.innerHTML = '';

      if (stations.length === 0) {
        listEl.innerHTML = '<li style="padding:20px; color:#9ca3af; text-align:center;">未找到符合的捷運站點</li>';
        return;
      }

      stations.forEach(st => {
        const accCount = st.exits.filter(e => e.acc === '是').length;
        const li = document.createElement('li');
        li.className = 'station-item';
        li.innerHTML = `
          <h3>${st.name}</h3>
          <p>📍 ${st.loc}</p>
          <span class="station-badge">出口: ${st.exits.length} | 無障礙: ${accCount}</span>
        `;
        li.onclick = () => focusStation(st);
        listEl.appendChild(li);
      });
    }

    // 搜尋與篩選邏輯
    function filterStations() {
      const keyword = document.getElementById('search').value.trim().toLowerCase();
      const accessibleOnly = document.getElementById('accessibleOnly').checked;

      const filtered = stationsData.filter(st => {
        const matchesName = st.name.toLowerCase().includes(keyword);
        const matchesLoc = st.loc.toLowerCase().includes(keyword);
        const hasAccessible = st.exits.some(e => e.acc === '是');

        const matchesSearch = matchesName || matchesLoc;
        const matchesFilter = accessibleOnly ? hasAccessible : true;

        return matchesSearch && matchesFilter;
      });

      renderSidebar(filtered);
    }

    // 地圖定位與彈窗觸發
    function focusStation(station) {
      if (!station.lat || !station.lng) return;
      const marker = markerMap[station.code];
      
      map.setView([station.lat, station.lng], 16);
      
      if (marker) {
        markersGroup.zoomToShowLayer(marker, () => {
          marker.openPopup();
        });
      }
    }

    // 初始進入點
    initMarkers();
    renderSidebar(stationsData);
  </script>
